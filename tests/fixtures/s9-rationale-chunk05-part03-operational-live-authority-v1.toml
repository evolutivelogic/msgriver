[release]
runtime_owner = "root:root"
runtime_mode = 457
release_mode = 448
program_mode = 365
manifest_mode = 292
programs = ["controller", "issuer", "broker", "adapter", "gateway", "checker", "launcher"]

[receipt]
canonical = true
single_use = true
state_mode = 384
key = ["receipt_sha256", "call_id", "readiness_sha256", "authority_sha256"]
write_ahead = "started-fsync-before-child"
terminal = ["success", "failure", "unknown"]

[child]
stdin = "exact-part03-bundle"
private_profile = true
empty_mcp = true
environment = ["HOME", "LANG", "LC_ALL", "PATH", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL", "ANTHROPIC_AUTH_TOKEN"]
flags = ["-p", "--bare", "--safe-mode", "--strict-mcp-config", "--mcp-config", "<root-private-empty-mcp>", "--tools", "", "--no-session-persistence", "--disable-slash-commands", "--no-chrome", "--model", "glm-5.3", "--output-format", "json", "--permission-mode", "dontAsk", "--max-turns", "1"]
network = "private-child-loopback-exact-port-seccomp"

[gateway]
capability_bytes = 32
capability_ttl_seconds = 30
capability_binds = ["call_id", "receipt_sha256", "readiness_sha256", "authority_sha256"]
local_head_path = "/api/anthropic/api/hello"
local_post_path = "/api/anthropic/v1/messages?beta=true"
upstream_host = "api.z.ai"
upstream_post_path = "/api/anthropic/v1/messages?beta=true"
forwarded_provider_requests = 1
local_head_upstream_requests = 0

[capture]
spool = "root-sealed-renameat2-noreplace"
checker_fd = 3
records = ["receipt", "receipt-validation", "readiness", "readiness-validation", "authority", "adapter", "envelope", "stderr", "transport", "validation", "ledger-projection"]

[controller]
arguments = ["--check", "--fixture-dir"]
green = "GREEN S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-CONTROLLER check=complete terminal=success spool_id=<32hex>"
pre_reservation_red = "RED S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-CONTROLLER <code>"
post_reservation_red = "RED S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-CONTROLLER <code> spool_id=<32hex>"

[broker]
state_inspect = ["--selftest", "--inspect-state", "--spool-id"]
receipt_inspect = ["--selftest", "--inspect-receipt-sha", "--receipt-sha"]
registry_inspect = ["--selftest", "--inspect-registry"]
spool_handoff = ["--selftest", "--handoff-spool-fd", "--spool-id", "<32hex>", "--control-fd", "3"]
state_green = "GREEN S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-BROKER state spool_id=<32hex> terminal=<terminal> child_invocations=<nonnegative> ledger_delta=<0|1>"
receipt_green = "GREEN S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-BROKER state receipt_sha256=<64hex> terminal=<terminal> spool_id=<32hex-or-null> child_invocations=<nonnegative> ledger_delta=<0|1>"
registry_green = "GREEN S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-BROKER registry entries=<nonnegative> sha256=<64hex>"
handoff_green = "GREEN S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-BROKER handoff spool_id=<32hex>"

[checker]
arguments = ["--spool-fd", "3"]
green = "GREEN S9-RATIONALE-CHUNK05-PART03-OPERATIONAL-LIVE-AUTHORITY-CHECKER spool_sha256=<64hex>"

[promotion]
semantic_credit = false
canonical_ownership_installation = false
production_rust = false
service = false
publication = false
tag = false

