[release]
roles = ["issuer", "broker", "runner", "gateway", "checker", "launcher"]
runtime_owner = "root:root"
runtime_mode = 457
release_mode = 448
program_mode = 365
manifest_mode = 292

[receipt]
canonical = true
single_use = true
state_mode = 384
key = ["receipt_sha256", "call_id", "readiness_sha256", "authority_sha256", "bundle_sha256"]
write_ahead = "started-fsync-before-child"
terminal = ["success", "failure", "unknown"]

[child]
stdin = "exact-23-row-bundle"
private_profile = true
empty_mcp = true
environment = ["HOME", "LANG", "LC_ALL", "PATH", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL", "ANTHROPIC_AUTH_TOKEN"]
flags = ["-p", "--bare", "--safe-mode", "--strict-mcp-config", "--mcp-config", "<root-empty-mcp>", "--tools", "", "--no-session-persistence", "--disable-slash-commands", "--no-chrome", "--model", "glm-5.3", "--output-format", "json", "--permission-mode", "dontAsk", "--max-turns", "1"]
network = "private-child-loopback-exact-port-seccomp"

[gateway]
capability_bytes = 32
capability_ttl_seconds = 30
capability_binds = ["call_id", "receipt_sha256", "readiness_sha256", "authority_sha256", "bundle_sha256"]
local_head_path = "/api/anthropic/api/hello"
local_post_path = "/api/anthropic/v1/messages?beta=true"
upstream_host = "api.z.ai"
upstream_post_path = "/api/anthropic/v1/messages?beta=true"
forwarded_provider_requests = 1
local_head_upstream_requests = 0

[capture]
spool = "root-sealed-renameat2-noreplace"
checker_fd = 3
records = ["receipt", "receipt-validation", "readiness", "readiness-validation", "authority", "adapter", "envelope", "stderr", "transport", "validation", "ledger-projection"]

[promotion]
semantic_credit = false
canonical_ownership_installation = false
production_rust = false
service = false
publication = false
tag = false

