[receipt]
format = "msgriver/s9-total-ownership-rationale-chunk05-part03-guard-receipt/v1"
validation_name = "guard-validation.txt"
json_name = "guard-receipt.json"
authorized_window_seconds = 30
provider = "zai-coding-plan-max"
model = "glm-5.3"
max_attempts = 1
tools = []
retry = false
fallback = false
single_use = true

[adapter]
# The future test creates this tiny executable inside the fixture.  The target
# must pin its bytes/mode and must refuse all other adapter paths, including
# the real GLM wrapper.
relative_path = "adapter/fake-glm-adapter.py"
mode = 493
provider = "zai-coding-plan-max"
model = "glm-5.3"
prompt_source = "preflight.bundle"
flags = ["--bare", "--safe-mode", "--strict-mcp-config", "--tools", "", "--no-session-persistence", "--disable-slash-commands", "--no-chrome", "--max-turns", "1", "--output-format", "json", "--permission-mode", "dontAsk"]
empty_mcp_name = "empty-mcp.json"
workdir_mode = 448
environment_allowlist = ["HOME", "LANG", "LC_ALL", "PATH"]
probe_environment_allowlist = ["HOME", "LANG", "LC_ALL", "PATH", "MSGRIVER_FIXTURE_PROMPT_SHA256", "MSGRIVER_FIXTURE_ADAPTER_MODE", "MSGRIVER_FIXTURE_STDOUT", "MSGRIVER_FIXTURE_STDERR"]
probe_environment = { HOME = "/nonexistent", LANG = "C", LC_ALL = "C", PATH = "/usr/bin:/bin" }

[adapter.protocol]
stdin = "exact-preflight-bundle-bytes"
stdout = "fixture.stdout"
stderr = "fixture.stderr"
mode = "fixture.adapter_mode"
secret_sentinel = "fixture.secret_sentinel"
forbidden_paths = ["repository", "receipt", "state", "spool", "ledger", "output"]

[state]
format = "msgriver/s9-total-ownership-rationale-chunk05-part03-execution-state/v1"
mode = 384
link_count = 1
key = ["receipt_sha256", "call_id", "readiness_sha256", "authority_sha256"]
write_ahead = "started"
terminal = ["success", "failure", "unknown"]
recovery = "never_reinvoke"
lock = "exclusive"
empty = { format = "msgriver/s9-total-ownership-rationale-chunk05-part03-execution-state/v1", entries = [] }
entry_keys = ["key", "status", "started_at", "terminal_at", "spool_id"]
entry_types = { key = "64-lowercase-hex", status = "started|success|failure|unknown", started_at = "utc-rfc3339", terminal_at = "utc-rfc3339-or-null", spool_id = "32-lowercase-hex-or-null" }
entry_state_invariants = { started = "terminal_at=null,spool_id=null", success = "terminal_at=utc,spool_id=32hex", failure = "terminal_at=utc,spool_id=32hex", unknown = "terminal_at=utc,spool_id=32hex" }

[ledger]
format = "msgriver/s9-total-ownership-rationale-chunk05-part03-execution-ledger-projection/v1"
initial_count = 41
expected_delta = 1
record_fields = ["provider", "model", "lane", "task", "cwd"]
expose_raw_bytes = false

[capture]
spool_mode = 488
file_mode = 288
spool_handle = "opaque-32hex-id"
checker_capability = "spool-fd-3"
checker_fd = 3
inventory = ["execution-receipt.json", "execution-receipt-validation.txt", "execution-readiness.json", "execution-readiness-validation.txt", "execution-authority.json", "execution-envelope.json", "execution-stderr.txt", "execution-transport.json", "execution-validation.txt"]
publish = "renameat2-noreplace"
raw_only = true
promotion = { semantic_credit = false, launch = false, canonical_ownership_installation = false, production_rust = false, service = false, publication = false, tag = false, later_parts_merged = false }

[checker]
program = "scripts/check_s9_rationale_chunk05_part03_execution.py"
argument = "--spool-fd"
fd = 3
user = "msgriver-check"
group = "msgriver-check"
stdout_prefix = "GREEN S9-RATIONALE-CHUNK05-PART03-EXECUTION-CHECKER spool_sha256="
stderr = ""
provisioning = "root-controlled-reversible-harness-or-service-install-dco"

[controller]
