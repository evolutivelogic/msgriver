spool_id = "32-lowercase-hex"
post_reservation_red_spool_id = true
stderr = ""

[broker]
# Root-only post-crash verification resolves this opaque value inside the
# broker's own registry.  No controller, adapter or checker receives a
# runtime/state/spool path.
program = "scripts/execute_s9_rationale_chunk05_part03_broker.py"
state_projection_argument = "--inspect-state"
registry_projection_argument = "--inspect-registry"
checker_argument = "--verify-spool-id"
publication_projection_argument = "--inspect-publication"
spool_id_argument = "--spool-id"
requires_root = true
state_projection_fields = ["entries", "statuses", "sha256"]
publication_projection_fields = ["competitor", "stage_count", "worktree_unchanged"]
stdout_path_forbidden = true

[fixture]
adapter_mode = "success"
stdout = "{\"fixture\":\"raw-envelope\"}\n"
stderr = ""
secret_sentinel = "EXECUTION_SECRET_MUST_NOT_ESCAPE"
timeout_seconds = 1
concurrency_barrier = "fixture-barrier"
failpoints = ["before_started_fsync", "after_started_fsync", "before_publish", "after_publish"]
publication_drift = ["none", "destination-existing", "destination-partial", "destination-file", "destination-final-symlink", "destination-parent-symlink"]
isolation_probe = ["none", "repository", "receipt", "state", "spool", "ledger", "output"]
recovery_drift = ["none", "revoked", "expired"]

