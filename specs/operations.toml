# MsgRiver first-slice operation catalog.
#
# This file is normative source data. Tests freeze its digest before implementation and prove exact
# set equality against the API router, authorization dispatcher, API client, CLI parser, and generated
# documentation. One record represents exactly one method/path/action and exactly one CLI command.

